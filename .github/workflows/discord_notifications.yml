name: Discord Notification Filter
on:
  pull_request:
    types: [opened, closed]

jobs:
  notify:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Send Webhook
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "Novo PR: ${{ github.event.pull_request.title }} por ${{ github.actor }}"}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}